name: Release

# Run from main after bumping "version" in package.json. Builds dist/, commits it on a release
# commit that only the tag points at (main never carries dist/), tags it v<version> and pushes the
# tag, so that `pnpm add github:theframeworks/ai-solid#semver:^x.y.z` installs with no build step.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: pnpm install --frozen-lockfile

      - name: Type check, test and build
        run: pnpm check

      - name: Read the version
        id: version
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag already exists: bump version in package.json first"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Commit dist/ and tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --detach
          git add --force dist
          git commit --message "release: $TAG"
          git tag --annotate "$TAG" --message "$TAG"
          git push origin "$TAG"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --verify-tag --generate-notes
